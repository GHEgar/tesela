name: release

on:
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            tag:
                description: Tag to publish, for example v0.3.0
                required: true

permissions:
    contents: write
    id-token: write

env:
    TAG: ${{ inputs.tag || github.ref_name }}

jobs:
    npm:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ env.TAG }}
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
            - run: npm install -g npm@^11.5.1
            - run: npm ci
            - run: npm test
            - name: Tag and package.json agree
              run: test "v$(node -p "require('./package.json').version")" = "$TAG"
            - name: Release notes from the changelog
              run: awk -v v="${TAG#v}" 'index($0, "## [" v "]") == 1 { on = 1; next } on && /^## \[/ { exit } on' docs/CHANGELOG.md > notes.md
            - name: GitHub release
              run: gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "tesela ${TAG#v}" --notes-file notes.md --verify-tag
              env:
                  GH_TOKEN: ${{ github.token }}
            - name: npm
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  name=$(node -p "require('./package.json').name")
                  npm view "$name@${TAG#v}" version > /dev/null 2>&1 || npm publish --provenance --access public
